<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {% include head.html %}

  <body>


    {% if jekyll.environment != "production" %}
    <p style="border: 3px solid #FF0000; padding: 1em;">
      当前为网站预览版本。<a href="{{ "/" | absolute_url }}">返回正式网站</a>。
    </p>
    {% endif %}

    {% include header.html %}


    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

  </body>

</html>
